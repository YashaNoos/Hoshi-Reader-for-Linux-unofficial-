name: Build packages

# Builds the package in a clean Arch Linux container.
#  - every push / pull request / manual run: build only (a check that the patches still
#    apply and the app still compiles), the package is kept as a workflow artifact
#  - pushing a tag like `1.1.2-2` (pkgver-pkgrel): also publishes a GitHub release with
#    the .pkg.tar.zst, the experimental AppImage and their SHA-256 checksums

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tools
        run: |
          # every dependency is installed up front, so makepkg needs no root/sudo
          pacman -Syu --noconfirm --needed git rust nodejs pnpm cmake pkgconf \
            webkit2gtk-4.1 gtk3 libsoup3 openssl gst-plugins-good gst-libav noto-fonts-cjk

      - uses: actions/checkout@v4

      - name: Check that the tag matches the PKGBUILD
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          . ./arch/PKGBUILD
          if [ "${GITHUB_REF_NAME}" != "${pkgver}-${pkgrel}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pkgver-pkgrel (${pkgver}-${pkgrel})" >&2
            exit 1
          fi

      - name: Build as an unprivileged user (makepkg refuses root)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "set -o pipefail; cd '$GITHUB_WORKSPACE/arch' && makepkg --noconfirm --nocheck 2>&1 | tee build.log"

      - name: Show the end of the build log as an annotation on failure
        if: failure()
        run: |
          tail -n 30 "$GITHUB_WORKSPACE/arch/build.log" 2>/dev/null | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt || true
          echo "::error title=makepkg failed::$(cat /tmp/tail.txt)"

      - name: Checksum
        run: |
          cd "$GITHUB_WORKSPACE/arch"
          # the -debug package (symbols for crash analysis) is not part of a release
          rm -f ./*-debug-*.pkg.tar.zst
          for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          ls -l *.pkg.tar.zst*

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          # relative paths: in a container job ${{ github.workspace }} is the host path,
          # not the container's, which can nest the files inside the artifact
          path: |
            arch/*.pkg.tar.zst
            arch/*.pkg.tar.zst.sha256
          if-no-files-found: error

  # Experimental AppImage for distributions other than Arch (Bazzite, Fedora, Ubuntu, ...).
  # Built on Ubuntu 24.04 from the same upstream tag and the same patches as the Arch
  # package, so it runs on any distribution with glibc 2.39 or newer. WebKitGTK, GTK and
  # the GStreamer plugins are bundled, which is why the file is large (~175 MB).
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the PKGBUILD
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          . ./arch/PKGBUILD
          if [ "${GITHUB_REF_NAME}" != "${pkgver}-${pkgrel}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pkgver-pkgrel (${pkgver}-${pkgrel})" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # gcc-14: the dictionary engine needs std::ranges::to (GCC 14+)
          # gstreamer plugins: bundled into the AppImage so audiobooks (mp3/m4b) play
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config patchelf file wget bzip2 git xvfb dbus \
            gcc-14 g++-14 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get upstream source and apply the patches
        run: |
          # version, upstream URL, sherpa-onnx archive and checksum all come from the PKGBUILD
          . ./arch/PKGBUILD
          git clone --depth 1 --branch "v${pkgver}" "${_upstream_url}.git" hoshi-src
          for p in arch/*.patch; do
            echo "Applying ${p##*/}"
            git -C hoshi-src apply "$GITHUB_WORKSPACE/$p"
          done
          mkdir sherpa
          curl -fsSL -o "sherpa/${source[-1]##*/}" "${source[-1]}"
          echo "${sha256sums[-1]}  sherpa/${source[-1]##*/}" | sha256sum -c -
          # the pnpm version upstream pins in package.json
          pm=$(node -p "require('./hoshi-src/package.json').packageManager")
          npm install -g "${pm%%+*}"
          cd hoshi-src
          pnpm install --frozen-lockfile

      - name: Build the AppImage
        run: |
          set -o pipefail
          . ./arch/PKGBUILD
          cd hoshi-src
          export CC=gcc-14 CXX=g++-14
          export SHERPA_ONNX_ARCHIVE_DIR="$GITHUB_WORKSPACE/sherpa"
          export CXXFLAGS="-include cstdint -include algorithm -include cstring -include memory -include string -include vector -include limits"
          # the runner has no FUSE: let linuxdeploy (itself an AppImage) unpack and run
          export APPIMAGE_EXTRACT_AND_RUN=1
          # linuxdeploy copies each bundled library's license file, except for these packages
          # (GStreamer plugins, GIO modules, the SVG loader): add theirs explicitly. Packages
          # not installed are not bundled either; the manifest step warns about any gap.
          config=$(python3 -c '
          import json
          pkgs = ["gstreamer1.0-plugins-base", "gstreamer1.0-plugins-good", "gstreamer1.0-plugins-bad",
                  "gstreamer1.0-libav", "glib-networking", "dconf-gsettings-backend", "librsvg2-common"]
          import os
          files = {f"/usr/share/doc/{p}/copyright": f"/usr/share/doc/{p}/copyright" for p in pkgs
                   if os.path.isfile(f"/usr/share/doc/{p}/copyright")}  # only installed ones
          print(json.dumps({"bundle": {"createUpdaterArtifacts": False, "linux": {"appimage":
              {"bundleMediaFramework": True, "files": files}}}}))')
          pnpm tauri build --bundles appimage --config "$config" 2>&1 | tee ../appimage-build.log
          cd "$GITHUB_WORKSPACE"
          out="Hoshi-Reader-for-Linux-${pkgver}-${pkgrel}-x86_64.AppImage"
          mv hoshi-src/src-tauri/target/release/bundle/appimage/*.AppImage "$out"
          sha256sum "$out" > "$out.sha256"
          # list of bundled Ubuntu packages, versions and source packages (see THIRD_PARTY.md)
          .github/scripts/appimage-manifest.sh \
            "hoshi-src/src-tauri/target/release/bundle/appimage/Hoshi Reader.AppDir" "$out.packages.md"
          ls -l "$out"*

      - name: Show the end of the build log as an annotation on failure
        if: failure()
        run: |
          tail -n 30 "$GITHUB_WORKSPACE/appimage-build.log" 2>/dev/null | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt || true
          echo "::error title=AppImage build failed::$(cat /tmp/tail.txt)"

      # Starts the app for 25 seconds on a virtual X display. It only shows that the bundle
      # launches and stays alive (all libraries found); it does not replace real testing.
      - name: Smoke test (does the app start?)
        continue-on-error: true
        run: |
          f=$(ls "$GITHUB_WORKSPACE"/Hoshi-Reader-for-Linux-*.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1
          rc=0
          xvfb-run -a dbus-run-session -- timeout 25 "$f" > smoke.log 2>&1 || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::notice title=Smoke test::The AppImage started and stayed running for 25 s"
          else
            echo "::warning title=Smoke test::The AppImage exited early with code $rc: $(tail -n 8 smoke.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            ${{ github.workspace }}/Hoshi-Reader-for-Linux-*.AppImage
            ${{ github.workspace }}/Hoshi-Reader-for-Linux-*.AppImage.sha256
            ${{ github.workspace }}/Hoshi-Reader-for-Linux-*.AppImage.packages.md
          if-no-files-found: error

  release:
    needs: [build, appimage]
    # the Arch package is published even if the experimental AppImage failed
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.appimage.result == 'success'
        with:
          name: appimage
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "$GITHUB_REF_NAME" dist
